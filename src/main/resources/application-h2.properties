spring.application.name=wallet-system

# Embedded database (MySQL compatibility mode, persisted locally)
spring.datasource.url=jdbc:h2:file:./data/wallet_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

server.port=8082
springdoc.packages-to-scan=com.mansi.wallet_system.controller
management.endpoint.health.show-details=always
management.health.redis.enabled=false
spring.autoconfigure.exclude=org.redisson.spring.starter.RedissonAutoConfigurationV2
app.seed-data=true
