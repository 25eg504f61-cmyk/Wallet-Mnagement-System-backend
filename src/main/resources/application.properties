spring.application.name=wallet-system

# Database Configuration (Configured for MySQL 8.0 on port 3306; overridable via environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/wallet_system?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

server.port=8082

springdoc.packages-to-scan=com.mansi.wallet_system.controller

management.endpoint.health.show-details=always
management.health.redis.enabled=false
spring.autoconfigure.exclude=org.redisson.spring.starter.RedissonAutoConfigurationV2
app.seed-data=true
